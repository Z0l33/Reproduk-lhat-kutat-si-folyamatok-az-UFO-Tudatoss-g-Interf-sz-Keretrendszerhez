name: Verify datasets (manual, needs network)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fetch and verify every dataset in the manifest
        # --allow-unpinned: a first fetch has no SHA-256 pin yet and reports "unpinned".
        # That is never treated as verified; pin the printed SHA-256 after reviewing the file.
        run: python -m ufo_pipeline fetch --manifest data/manifest/datasets.json --allow-unpinned
      - name: Print provenance (status, source checksum result, SHA-256)
        if: always()
        run: |
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob("provenance/*.json")):
              prov = json.load(open(path))
              print(path, "status:", prov["status"], "errors:", prov["errors"])
              for f in prov["files"]:
                  print("  ", f["name"], "| status:", f["status"], "| size:", f["size"],
                        "| source checksum ok:", f["api_checksum_verified"], "| sha256:", f["sha256"],
                        "| file errors:", f["errors"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance
          path: provenance/*.json
          if-no-files-found: warn
