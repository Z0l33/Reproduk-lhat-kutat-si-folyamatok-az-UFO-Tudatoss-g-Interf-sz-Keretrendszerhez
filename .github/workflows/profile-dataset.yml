name: profile-dataset

# Manual. Downloads one dataset (verification as in `fetch`, first fetch may be unpinned),
# then prints a structural profile (counts and ranges, no free text) to the job summary.
# The reports/ file is the exact byte output of the QA step (compared by cmp in the reproducibility step).
on:
  pull_request:
    paths: [".github/workflows/profile-dataset.yml"]   # lets the workflow be tried from a PR branch
  workflow_dispatch:
    inputs:
      dataset:
        description: "dataset_id from data/manifest/datasets.json"
        required: false
        default: "gep-ufo-uap-2026-10"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m ufo_pipeline fetch --dataset "${{ inputs.dataset || 'gep-ufo-uap-2026-10' }}" --allow-unpinned
      - name: Profile every downloaded file
        shell: bash
        run: |
          set -euo pipefail
          ds="${{ inputs.dataset || 'gep-ufo-uap-2026-10' }}"
          shopt -s nullglob
          files=("data/raw/$ds"/*.csv)
          if [ "${#files[@]}" -eq 0 ]; then echo "no CSV found in data/raw/$ds" >&2; exit 1; fi
          : > profile.json
          for f in "${files[@]}"; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python -m ufo_pipeline profile "$f" | tee -a "$GITHUB_STEP_SUMMARY" profile.json
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Read-only quality and privacy screen (counts only)
        shell: bash
        run: |
          set -euo pipefail
          ds="${{ inputs.dataset || 'gep-ufo-uap-2026-10' }}"
          shopt -s nullglob
          for f in "data/raw/$ds"/*.csv; do
            python -m ufo_pipeline gep-qa "$f" --out qa-report.json
            echo "### QA report for $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat qa-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          test -s qa-report.json
      - name: Reproducibility and integrity check (no data printed)
        shell: bash
        run: |
          set -euo pipefail
          ds="${{ inputs.dataset || 'gep-ufo-uap-2026-10' }}"
          f=$(ls "data/raw/$ds"/*.csv | head -1)
          before=$(sha256sum "$f" | cut -d' ' -f1)
          python -m ufo_pipeline gep-qa "$f" --out qa-1.json
          python -m ufo_pipeline gep-qa "$f" --out qa-2.json
          after=$(sha256sum "$f" | cut -d' ' -f1)
          cmp qa-1.json qa-2.json && echo "two runs: byte-identical reports"
          [ "$before" = "$after" ] && echo "CSV sha256 unchanged by the checks"
          python - <<'PY'
          import json
          r = json.load(open("qa-1.json"))
          assert r["input"]["unchanged_during_analysis"] is True
          assert r["input"]["sha256"] == r["input"]["sha256_after"]
          PY
          report_sha=$(sha256sum qa-1.json | cut -d' ' -f1)
          ref="reports/$ds.qa.json"
          if [ -f "$ref" ]; then
            if cmp -s qa-1.json "$ref"; then echo "report identical to committed $ref"; else echo "REPORT DIFFERS from committed $ref"; fi
          fi
          echo "csv_sha256=$before"
          echo "report_sha256=$report_sha"
          echo "commit=$GITHUB_SHA run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "python=$(python --version 2>&1) numpy=$(python -c 'import numpy;print(numpy.__version__)')"
          rm -f qa-1.json qa-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: profile
          path: |
            profile.json
            qa-report.json
            provenance/*.json
