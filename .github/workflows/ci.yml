name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Browser-rendered checks must RUN in CI: a skip caused by a missing Playwright/Chromium is a failure here.
      UFO_REQUIRE_BROWSER: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Playwright and Chromium (rendered accessibility checks)
        run: |
          python -m pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
      - name: Validate dataset manifest (offline)
        run: python -m ufo_pipeline validate-manifest --manifest data/manifest/datasets.json
      - name: Run tests
        run: python -m pytest -q
      - name: Concurrent, shuffled runs must pass and leave the tree clean
        shell: bash
        run: |
          set -u
          git status --porcelain > before.txt
          pids=()
          for seed in 11 22 33 44; do
            (UFO_TEST_SHUFFLE_SEED=$seed python -m pytest -q -p no:cacheprovider > "par_$seed.txt" 2>&1; echo $? > "par_$seed.rc") &
            pids+=($!)
          done
          wait "${pids[@]}"
          fail=0
          for seed in 11 22 33 44; do
            echo "seed $seed rc=$(cat par_$seed.rc): $(tail -1 par_$seed.txt)"
            [ "$(cat par_$seed.rc)" = 0 ] || { fail=1; cat "par_$seed.txt"; }
          done
          rm -f par_*.txt par_*.rc
          git status --porcelain | diff before.txt - || { echo "tests modified the working tree"; fail=1; }
          rm -f before.txt
          exit $fail

