[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ufo-pipeline"
version = "0.1.0"
description = "Reproducible research pipeline: Zenodo retrieval, integrity verification, leakage detection, SESOI-based inference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ufo_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
